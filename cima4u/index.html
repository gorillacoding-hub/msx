<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cima4U TV</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#f5f7fb;font-family:Arial,sans-serif}
header{background:#111b2d;border-bottom:3px solid #eab849;padding:18px 4%;position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:bold;color:#eab849;margin-right:auto}
.logo span{color:#fff}
nav{display:flex;gap:8px;flex-wrap:wrap}
button,input{font:inherit;border-radius:8px;border:1px solid #40516c;padding:12px}
button{background:#1b2a42;color:#fff;cursor:pointer}
button.active,button:focus,button:hover{background:#eab849;color:#101827;outline:3px solid #f6cf76;outline-offset:2px}
input{background:#081321;color:#fff;min-width:220px}
main{padding:25px 4%}
h1{color:#eab849;margin:8px 0}
#status{color:#aebbd0;margin:8px 0 20px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}
.card{min-height:155px;background:linear-gradient(145deg,#1b2c47,#101a2c);border:1px solid #354762;border-radius:12px;padding:16px;color:#fff;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
.card strong{font-size:17px;line-height:1.35}
.card small{color:#aebbd0;margin-top:8px}
.card:focus{border:2px solid #eab849}
#detail{display:none;background:#142139;border:1px solid #52627b;border-radius:12px;padding:22px;margin:20px 0}
#detail h2{color:#eab849}
#detail p{line-height:1.5;color:#c6d0df}
#empty{padding:30px;color:#aebbd0;display:none}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){
.grid{grid-template-columns:repeat(2,1fr)}
.top{align-items:stretch}
nav{order:3;width:100%}
nav button{flex:1}
form{display:flex;width:100%}
form input{flex:1;min-width:0}
}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
 <div class="top">
  <div class="logo">CIMA<span>4U</span></div>
  <nav id="nav">
   <button class="active" data-filter="all">HOME</button>
   <button data-filter="movie">MOVIES</button>
   <button data-filter="series">SERIES</button>
   <button data-filter="anime">ANIME</button>
  </nav>
  <form id="searchForm">
   <input id="search" type="search" placeholder="Search titles">
   <button type="submit">SEARCH</button>
  </form>
 </div>
</header>

<main>
 <h1 id="heading">Discover</h1>
 <p id="status">Your Cima4U TV library</p>

 <section id="detail">
  <button id="backButton">BACK TO TITLES</button>
  <h2 id="detailTitle"></h2>
  <p id="detailDescription"></p>
  <p id="detailNotice">Episode playback information is not available yet.</p>
 </section>

 <div class="grid" id="catalogue"></div>
 <div id="empty">No matching titles found.</div>
</main>

<script>
(function(){
"use strict";

var allItems=[];
var activeFilter="all";
var query="";

var grid=document.getElementById("catalogue");
var detail=document.getElementById("detail");
var heading=document.getElementById("heading");
var status=document.getElementById("status");
var empty=document.getElementById("empty");

function clean(value){
 return String(value||"")
 .replace(/<[^>]*>/g," ")
 .replace(/\s+/g," ")
 .replace(/^\s+|\s+$/g,"");
}

function matches(item){
 var title=clean(item.title).toLowerCase();
 var q=query.toLowerCase();
 var type=clean(item.type||"").toLowerCase();

 if(q&&title.indexOf(q)===-1)return false;

 if(activeFilter==="movie"&&
 type.indexOf("movie")===-1&&
 type.indexOf("film")===-1)return false;

 if(activeFilter==="series"&&
 type.indexOf("series")===-1&&
 type.indexOf("episode")===-1)return false;

 if(activeFilter==="anime"&&
 type.indexOf("anime")===-1&&
 title.indexOf("anime")===-1)return false;

 return true;
}

function openItem(item){
 detail.style.display="block";
 grid.style.display="none";
 empty.style.display="none";

 document.getElementById("detailTitle").innerHTML="";
 document.getElementById("detailTitle").appendChild(
  document.createTextNode(clean(item.title))
 );

 document.getElementById("detailDescription").innerHTML="";
 document.getElementById("detailDescription").appendChild(
  document.createTextNode(
   clean(item.description)||"No description available."
  )
 );

 document.getElementById("detailNotice").innerHTML=
 "This title is in your library. Episode and video-server data are not yet available.";

 heading.innerHTML="Title";
 status.innerHTML="Selected title";

 document.getElementById("backButton").focus();
}

function render(){
 detail.style.display="none";
 grid.style.display="grid";
 grid.innerHTML="";

 var count=0;

 for(var i=0;i<allItems.length;i++){
  if(!matches(allItems[i]))continue;

  var item=allItems[i];
  var button=document.createElement("button");
  button.className="card";
  button.setAttribute("data-index",i);

  var title=document.createElement("strong");
  title.appendChild(
   document.createTextNode(clean(item.title)||"Untitled")
  );

  var small=document.createElement("small");
  small.appendChild(
   document.createTextNode(clean(item.type)||"Cima4U title")
  );

  button.appendChild(title);
  button.appendChild(small);

  button.onclick=(function(selected){
   return function(){openItem(selected);};
  })(item);

  grid.appendChild(button);
  count++;
 }

 heading.innerHTML=
 activeFilter==="all"?"Discover":activeFilter.toUpperCase()+"S";

 status.innerHTML=count+" titles in this view";
 empty.style.display=count?"none":"block";
}

function load(){
 var xhr=new XMLHttpRequest();

 xhr.open(
  "GET",
  "catalogue.json?updated="+(new Date().getTime()),
  true
 );

 xhr.onreadystatechange=function(){
  if(xhr.readyState!==4)return;

  if(xhr.status>=200&&xhr.status<300){
   try{
    var data=JSON.parse(xhr.responseText);

    if(data&&data.length){
     allItems=data;
     status.innerHTML="Library loaded";
    }
   }catch(e){
    status.innerHTML="Could not read the catalogue.";
   }
  }else{
   status.innerHTML=
   "Catalogue is waiting for its first successful update.";
  }

  render();
 };

 xhr.send();
}

var nav=document.getElementById("nav");

nav.onclick=function(e){
 var target=e.target;

 if(target.tagName!=="BUTTON")return;

 activeFilter=target.getAttribute("data-filter");

 var buttons=nav.getElementsByTagName("button");

 for(var i=0;i<buttons.length;i++){
  buttons[i].className="";
 }

 target.className="active";
 render();
};

document.getElementById("searchForm").onsubmit=function(e){
 e.preventDefault();
 query=clean(document.getElementById("search").value);
 render();
};

document.getElementById("search").oninput=function(){
 query=clean(this.value);
 render();
};

document.getElementById("backButton").onclick=function(){
 detail.style.display="none";
 render();
};

document.onkeydown=function(e){
 e=e||window.event;
 var key=e.keyCode;

 if(key===8||key===27){
  if(detail.style.display==="block"){
   detail.style.display="none";
   render();
   e.preventDefault();
  }
 }

 if(key!==37&&key!==38&&key!==39&&key!==40)return;

 var cards=grid.getElementsByTagName("button");

 if(!cards.length||detail.style.display==="block")return;

 var index=-1;

 for(var i=0;i<cards.length;i++){
  if(cards[i]===document.activeElement){
   index=i;
   break;
  }
 }

 if(index<0){
  cards[0].focus();
  return;
 }

 var next=index;

 if(key===39)next=Math.min(cards.length-1,index+1);
 if(key===37)next=Math.max(0,index-1);
 if(key===40)next=Math.min(cards.length-1,index+5);
 if(key===38)next=Math.max(0,index-5);

 cards[next].focus();
 e.preventDefault();
};

load();

})();
</script>

</body>
</html>
