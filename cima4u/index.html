<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cima4U TV</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:Arial,sans-serif}
header{background:#111b2d;border-bottom:3px solid #eab849;padding:18px 4%}
.top{display:flex;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:bold;color:#eab849;margin-right:auto}
.logo span{color:white}
nav{display:flex;gap:8px;flex-wrap:wrap}
button,input{font-size:16px;padding:13px;border-radius:8px;border:1px solid #45536a}
button{background:#1b2a42;color:white;cursor:pointer}
button:focus,button:hover,button.active{background:#eab849;color:#111;outline:3px solid #f3bd50}
input{background:#080d18;color:white;min-width:200px}
main{padding:25px 4%}
h1{color:#eab849}
#status{color:#aab6c9}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:25px}
.card{min-height:130px;background:#142139;border:1px solid #35445d;border-radius:12px;padding:20px;color:white;text-align:left;display:flex;flex-direction:column;justify-content:center}
.card strong{font-size:19px}
.card small{color:#aab6c9;margin-top:10px}
.card:focus{border:2px solid #eab849}
#screen{display:none}
#back{margin:15px 0}
#detail{background:#142139;padding:20px;border-radius:12px}
footer{text-align:center;color:#77869c;padding:25px}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.grid{grid-template-columns:1fr}nav{width:100%}nav button{flex:1}form{display:flex;width:100%}form input{flex:1;min-width:0}}
</style>
</head>

<body>

<header>
 <div class="top">
  <div class="logo">CIMA<span>4U</span></div>

  <nav id="nav">
   <button class="active" data-page="home">HOME</button>
   <button data-page="movies">MOVIES</button>
   <button data-page="series">SERIES</button>
   <button data-page="anime">ANIME</button>
  </nav>

  <form id="searchForm">
   <input id="search" placeholder="Search titles">
   <button type="submit">SEARCH</button>
  </form>
 </div>
</header>

<main>
 <section id="homeScreen">
  <h1 id="heading">Welcome to Cima4U</h1>
  <p id="status">Choose a category to browse.</p>
  <div class="grid" id="grid"></div>
 </section>

 <section id="screen">
  <button id="back">← BACK</button>
  <div id="detail">
   <h1 id="detailTitle"></h1>
   <p id="detailText"></p>
  </div>
 </section>
</main>

<footer>Cima4U TV</footer>

<script>
(function(){

var categories=[
 {name:"Foreign Movies",type:"movies"},
 {name:"Arabic Movies",type:"movies"},
 {name:"Asian Movies",type:"movies"},
 {name:"Turkish Movies",type:"movies"},
 {name:"Indian Movies",type:"movies"},
 {name:"Foreign Series",type:"series"},
 {name:"Arabic Series",type:"series"},
 {name:"Turkish Series",type:"series"},
 {name:"Asian Series",type:"series"},
 {name:"Anime",type:"anime"},
 {name:"TV Shows",type:"series"}
];

var grid=document.getElementById("grid");
var home=document.getElementById("homeScreen");
var screen=document.getElementById("screen");
var heading=document.getElementById("heading");
var status=document.getElementById("status");
var currentPage="home";
var previousPage="home";

function showCategories(page,search){

 currentPage=page;
 home.style.display="block";
 screen.style.display="none";
 grid.innerHTML="";

 var count=0;

 for(var i=0;i<categories.length;i++){

  var item=categories[i];

  if(page!=="home"&&page!=="search"&&item.type!==page){
   continue;
  }

  if(search&&item.name.toLowerCase().indexOf(search.toLowerCase())===-1){
   continue;
  }

  var button=document.createElement("button");
  button.className="card";

  var title=document.createElement("strong");
  title.appendChild(document.createTextNode(item.name));

  var subtitle=document.createElement("small");
  subtitle.appendChild(document.createTextNode("Browse "+item.name));

  button.appendChild(title);
  button.appendChild(subtitle);

  button.onclick=(function(selected){
   return function(){
    openCategory(selected);
   };
  })(item);

  grid.appendChild(button);
  count++;
 }

 heading.innerHTML=page==="home"?"Welcome to Cima4U":page.toUpperCase();
 status.innerHTML=count+" categories available";

 if(!count){
  status.innerHTML="No matching categories.";
 }
}

function openCategory(item){

 previousPage=currentPage;

 home.style.display="none";
 screen.style.display="block";

 document.getElementById("detailTitle").innerHTML="";
 document.getElementById("detailTitle").appendChild(
  document.createTextNode(item.name)
 );

 document.getElementById("detailText").innerHTML=
 "You are viewing "+item.name+". Title listings will appear here when the catalogue is connected.";

 document.getElementById("back").focus();
}

document.getElementById("nav").onclick=function(e){

 if(e.target.tagName!=="BUTTON")return;

 var buttons=this.getElementsByTagName("button");

 for(var i=0;i<buttons.length;i++){
  buttons[i].className="";
 }

 e.target.className="active";

 showCategories(e.target.getAttribute("data-page"));
};

document.getElementById("searchForm").onsubmit=function(e){

 e.preventDefault();

 var value=document.getElementById("search").value;

 currentPage="search";

 showCategories("search",value);
};

document.getElementById("back").onclick=function(){

 showCategories(previousPage);
};

document.onkeydown=function(e){

 e=e||window.event;

 if(e.keyCode===8||e.keyCode===27){

  if(screen.style.display==="block"){
   showCategories(previousPage);
   e.preventDefault();
  }
 }

 if(e.keyCode!==37&&e.keyCode!==38&&
    e.keyCode!==39&&e.keyCode!==40)return;

 if(home.style.display==="none")return;

 var cards=grid.getElementsByTagName("button");

 if(!cards.length)return;

 var index=-1;

 for(var i=0;i<cards.length;i++){
  if(cards[i]===document.activeElement){
   index=i;
   break;
  }
 }

 if(index===-1){
  cards[0].focus();
  return;
 }

 var next=index;

 if(e.keyCode===39)next=Math.min(index+1,cards.length-1);
 if(e.keyCode===37)next=Math.max(index-1,0);
 if(e.keyCode===40)next=Math.min(index+4,cards.length-1);
 if(e.keyCode===38)next=Math.max(index-4,0);

 cards[next].focus();
 e.preventDefault();
};

showCategories("home");

})();
</script>

</body>
</html>
