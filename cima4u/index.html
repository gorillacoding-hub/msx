<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>Cima4U - Media Station X</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #080b12;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 75% 20%, #263b55 0%, transparent 45%),
        linear-gradient(135deg, #101b2a, #080b12 65%);
}

.screen {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 35px 6%;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
    border-bottom: 1px solid #354254;
    padding-bottom: 22px;
}

.logo {
    font-size: 36px;
    font-weight: 900;
    letter-spacing: 5px;
    color: #fff;
}

.logo span {
    color: #e8b95e;
}

.tagline {
    color: #aebdce;
    font-size: 14px;
    letter-spacing: 3px;
}

.hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    max-width: 850px;
    padding: 35px 0 55px;
}

.eyebrow {
    color: #e8b95e;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 4px;
}

h1 {
    font-size: clamp(38px, 6vw, 68px);
    line-height: 1.12;
    margin: 22px 0;
}

.description {
    max-width: 650px;
    color: #c1ccda;
    font-size: 21px;
    line-height: 1.6;
    margin: 0 0 35px;
}

.browse-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-width: 290px;
    min-height: 72px;
    padding: 18px 28px;
    background: #e8b95e;
    color: #111820;
    border: 4px solid transparent;
    border-radius: 8px;
    text-decoration: none;
    font-size: 19px;
    font-weight: 900;
    letter-spacing: 1px;
    outline: none;
}

.browse-button:focus,
.browse-button:active {
    background: #fff;
    color: #111820;
    border-color: #e8b95e;
    box-shadow: 0 0 0 6px rgba(232,185,94,.35);
}

.arrow {
    font-size: 22px;
}

.status {
    margin-top: 22px;
    color: #9eacbd;
    font-size: 15px;
}

footer {
    border-top: 1px solid #354254;
    padding-top: 18px;
    color: #8290a1;
    font-size: 12px;
    letter-spacing: 3px;
    text-align: center;
}

@media (max-width: 700px) {
    body {
        overflow-y: auto;
    }

    .screen {
        padding: 24px 6%;
    }

    .header {
        align-items: flex-start;
        flex-direction: column;
    }

    .logo {
        font-size: 30px;
    }

    .tagline {
        font-size: 11px;
    }

    .hero {
        min-height: 65vh;
    }

    .description {
        font-size: 17px;
    }

    .browse-button {
        min-width: 100%;
    }
}
</style>
</head>

<body>

<main class="screen">

    <header class="header">
        <div class="logo">CIMA<span>4U</span></div>
        <div class="tagline">MOVIES · SERIES · ENTERTAINMENT</div>
    </header>

    <section class="hero">

        <div class="eyebrow">YOUR ENTERTAINMENT HUB</div>

        <h1>
            Discover something<br>
            worth watching.
        </h1>

        <p class="description">
            Browse movies and series directly on the
            Cima4U website.
        </p>

        <a
            id="browse"
            class="browse-button"
            href="https://cimafu.live/"
            tabindex="0"
        >
            BROWSE CIMA4U
            <span class="arrow">&#9654;</span>
        </a>

        <div id="status" class="status">
            Use the arrow buttons and press ENTER to browse.
        </div>

    </section>

    <footer>
        CIMA4U · MEDIA STATION X
    </footer>

</main>

<script>
(function () {
    "use strict";

    var browse = document.getElementById("browse");
    var status = document.getElementById("status");

    function openCima() {
        window.location.href = "https://cimafu.live/";
    }

    browse.addEventListener("click", function () {
        status.innerHTML = "Opening Cima4U...";
    });

    document.addEventListener("keydown", function (event) {
        var key = event.keyCode || event.which;

        if (key === 13) {
            event.preventDefault();
            openCima();
        }
    });

    window.onload = function () {
        browse.focus();
    };

})();
</script>

</body>
</html>
