<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cima4U - Media Station X</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #100b1b;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

header {
    background: #211331;
    padding: 20px;
    border-bottom: 2px solid #7544a5;
}

header h1 {
    margin: 0;
    color: #cba5ff;
    font-size: 28px;
}

#navigation {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 15px;
    background: #181020;
}

button {
    background: #352044;
    color: #ffffff;
    border: 2px solid #634582;
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
    border-radius: 5px;
}

button:focus {
    outline: 3px solid #d7b4ff;
    background: #68439a;
    color: #ffffff;
}

#searchBox {
    display: block;
    width: calc(100% - 30px);
    margin: 15px;
    padding: 14px;
    background: #21182c;
    color: white;
    border: 2px solid #634582;
    border-radius: 5px;
    font-size: 18px;
}

#status {
    padding: 15px;
    color: #cba5ff;
    font-size: 18px;
}

#catalogue {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
    padding: 15px;
}

.card {
    background: #21182c;
    border: 2px solid #39264f;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
}

.card:focus {
    outline: 3px solid #d7b4ff;
    background: #352044;
}

.card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    background: #2b2038;
}

.cardTitle {
    padding: 10px;
    font-size: 17px;
    line-height: 1.3;
}

#details {
    display: none;
    padding: 20px;
    background: #181020;
}

#details h2 {
    color: #cba5ff;
    font-size: 25px;
}

#detailsPoster {
    max-width: 240px;
    width: 100%;
    height: auto;
    display: block;
    margin-bottom: 15px;
    border-radius: 5px;
}

#detailsDescription {
    font-size: 18px;
    line-height: 1.5;
    white-space: pre-wrap;
    margin-bottom: 20px;
}

#watchNow {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 20px 0;
    padding: 18px;
    background: #7b3fbd;
    border: 3px solid #cba5ff;
    color: white;
    font-size: 24px;
    font-weight: bold;
}

#watchNow:focus {
    background: #a66be8;
    outline: 4px solid white;
}

#backToCatalogue {
    margin-bottom: 20px;
}

#serverInfo {
    color: #bda6d8;
    font-size: 16px;
    margin-top: 10px;
}

.hidden {
    display: none !important;
}
</style></head><body><header>
    <h1>Cima4U</h1>
</header><div id="navigation">
    <button id="homeButton">HOME</button>
    <button id="moviesButton">MOVIES</button>
    <button id="seriesButton">SERIES</button>
    <button id="animeButton">ANIME</button>
</div><input
type="text"
id="searchBox"
placeholder="Search movies, series and anime..."

«»

<div id="status">Loading catalogue...</div><div id="catalogue"></div><div id="details">
    <button id="backToCatalogue">BACK TO TITLES</button><h2 id="detailsTitle"></h2>

<img id="detailsPoster" src="" alt="">

<div id="detailsDescription"></div>

<button id="watchNow">▶ WATCH NOW</button>

<div id="serverInfo"></div>

</div><script>
(function () {
    "use strict";

    var catalogue = [];
    var filteredItems = [];
    var currentCategory = "all";
    var selectedItem = null;

    var catalogueElement = document.getElementById("catalogue");
    var detailsElement = document.getElementById("details");
    var statusElement = document.getElementById("status");
    var searchBox = document.getElementById("searchBox");

    function requestCatalogue() {
        var xhr = new XMLHttpRequest();

        xhr.open("GET", "catalogue.json?v=" + new Date().getTime(), true);

        xhr.onreadystatechange = function () {
            if (xhr.readyState !== 4) {
                return;
            }

            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    var data = JSON.parse(xhr.responseText);

                    if (data && data.items && data.items.length) {
                        catalogue = data.items;
                    } else if (data && data.length) {
                        catalogue = data;
                    } else {
                        catalogue = [];
                    }

                    statusElement.innerHTML = catalogue.length ?
                        catalogue.length + " titles available" :
                        "The catalogue is empty.";

                    filterCatalogue();
                } catch (e) {
                    statusElement.innerHTML = "Could not read catalogue.json.";
                }
            } else {
                statusElement.innerHTML = "Could not load catalogue.";
            }
        };

        xhr.onerror = function () {
            statusElement.innerHTML = "Network error loading catalogue.";
        };

        xhr.send(null);
    }

    function getItemType(item) {
        var type = String(item.type || "").toLowerCase();

        if (type === "movie" || type === "series" || type === "anime") {
            return type;
        }

        var text = (
            String(item.category || "") + " " +
            String(item.title || "")
        ).toLowerCase();

        if (
            text.indexOf("anime") !== -1 ||
            text.indexOf("أنمي") !== -1
        ) {
            return "anime";
        }

        if (
            text.indexOf("series") !== -1 ||
            text.indexOf("مسلسل") !== -1 ||
            text.indexOf("الموسم") !== -1
        ) {
            return "series";
        }

        return "movie";
    }

    function filterCatalogue() {
        var query = searchBox.value.toLowerCase();
        filteredItems = [];

        var i;
        var item;
        var text;

        for (i = 0; i < catalogue.length; i++) {
            item = catalogue[i];

            if (
                currentCategory !== "all" &&
                getItemType(item) !== currentCategory
            ) {
                continue;
            }

            text = (
                String(item.title || "") + " " +
                String(item.category || "") + " " +
                String(item.description || "")
            ).toLowerCase();

            if (query && text.indexOf(query) === -1) {
                continue;
            }

            filteredItems.push(item);
        }

        renderCatalogue();
    }

    function renderCatalogue() {
        catalogueElement.innerHTML = "";

        detailsElement.style.display = "none";
        catalogueElement.style.display = "grid";
        statusElement.style.display = "block";

        if (!filteredItems.length) {
            statusElement.innerHTML = "No titles found.";
            return;
        }

        statusElement.innerHTML =
            filteredItems.length + " titles found";

        var i;
        var item;
        var card;
        var poster;
        var title;

        for (i = 0; i < filteredItems.length; i++) {
            item = filteredItems[i];

            card = document.createElement("div");
            card.className = "card";
            card.tabIndex = 0;

            poster = document.createElement("img");
            poster.alt = item.title || "";
            poster.src = item.poster || "";
            poster.onerror = function () {
                this.style.display = "none";
            };

            title = document.createElement("div");
            title.className = "cardTitle";
            title.innerHTML = escapeHTML(item.title || "Untitled");

            card.appendChild(poster);
            card.appendChild(title);

            card.onclick = (function (selected) {
                return function () {
                    openDetails(selected);
                };
            })(item);

            card.onkeydown = (function (selected) {
                return function (event) {
                    event = event || window.event;

                    if (
                        event.keyCode === 13 ||
                        event.keyCode === 32
                    ) {
                        openDetails(selected);
                    }
                };
            })(item);

            catalogueElement.appendChild(card);
        }
    }

    function openDetails(item) {
        selectedItem = item;

        catalogueElement.style.display = "none";
        statusElement.style.display = "none";
        detailsElement.style.display = "block";

        document.getElementById("detailsTitle").innerHTML =
            escapeHTML(item.title || "Untitled");

        document.getElementById("detailsDescription").innerHTML =
            escapeHTML(item.description || "No description available.");

        var poster = document.getElementById("detailsPoster");

        if (item.poster) {
            poster.src = item.poster;
            poster.style.display = "block";
        } else {
            poster.style.display = "none";
        }

        var servers = getServers(item);

        if (servers.length) {
            document.getElementById("serverInfo").innerHTML =
                servers.length + " video server(s) available.";
        } else {
            document.getElementById("serverInfo").innerHTML =
                "Video servers are not available yet for this title.";
        }

        document.getElementById("watchNow").focus();
    }

    function getServers(item) {
        var result = [];
        var source = item.servers || [];
        var i;
        var server;

        for (i = 0; i < source.length && result.length < 10; i++) {
            server = source[i];

            if (typeof server === "string") {
                if (server) {
                    result.push(server);
                }
            } else if (server && server.url) {
                result.push(server.url);
            }
        }

        return result;
    }

    function openPlayer(title, servers) {
        if (!servers || !servers.length) {
            document.getElementById("serverInfo").innerHTML =
                "Sorry, no video servers are available for this title yet.";
            return;
        }

        var url = "player.html?title=" + encodeURIComponent(title || "");

        var i;

        for (i = 0; i < servers.length && i < 10; i++) {
            url += "&server" + (i + 1) + "=" +
                encodeURIComponent(servers[i]);
        }

        window.location.href = url;
    }

    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    document.getElementById("watchNow").onclick = function () {
        if (!selectedItem) {
            return;
        }

        openPlayer(
            selectedItem.title,
            getServers(selectedItem)
        );
    };

    document.getElementById("backToCatalogue").onclick = function () {
        selectedItem = null;

        detailsElement.style.display = "none";
        catalogueElement.style.display = "grid";
        statusElement.style.display = "block";

        filterCatalogue();
    };

    document.getElementById("homeButton").onclick = function () {
        currentCategory = "all";
        searchBox.value = "";
        filterCatalogue();
    };

    document.getElementById("moviesButton").onclick = function () {
        currentCategory = "movie";
        filterCatalogue();
    };

    document.getElementById("seriesButton").onclick = function () {
        currentCategory = "series";
        filterCatalogue();
    };

    document.getElementById("animeButton").onclick = function () {
        currentCategory = "anime";
        filterCatalogue();
    };

    searchBox.onkeyup = function () {
        filterCatalogue();
    };

    requestCatalogue();
})();
</script></body>
    </html>
