<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b12">
    <title>Cima4U</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="screen">
        <header class="header">
            <div class="logo">CIMA<span>4U</span></div>
            <div class="tagline">MOVIES · SERIES · ENTERTAINMENT</div>
        </header>

        <section class="hero">
            <div class="eyebrow">YOUR ENTERTAINMENT HUB</div>
            <h1>Discover something<br>worth watching.</h1>
            <p>
                Browse movies and series directly on the
                Cima4U website.
            </p>

            <a id="browse" class="browse-button"
               href="https://cimafu.live/">
                BROWSE CIMA4U
                <span class="arrow">&#9654;</span>
            </a>

            <div id="status" class="status">
                Select Browse Cima4U to enter the website.
            </div>
        </section>

        <footer>
            CIMA4U · MEDIA STATION X
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
