<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cima4U</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101116;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    background: #191a22;
    padding: 16px 20px;
    border-bottom: 2px solid #e50935;
}

.logo {
    color: #e50935;
    font-size: 27px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: #191a22;
    flex-wrap: wrap;
}

button, input {
    font-family: Arial, sans-serif;
}

button {
    border: 1px solid #393b47;
    background: #252732;
    color: white;
    padding: 11px 17px;
    border-radius: 5px;
    font-size: 15px;
    cursor: pointer;
}

button.active {
    background: #e50935;
    border-color: #e50935;
}

button:focus, input:focus, .movie:focus {
    outline: 3px solid #e50935;
    outline-offset: 2px;
}

.search-area {
    padding: 15px 20px;
}

#search {
    width: 100%;
    max-width: 600px;
    padding: 14px;
    background: #20212a;
    color: white;
    border: 1px solid #444653;
    border-radius: 5px;
    font-size: 17px;
}

#status {
    color: #bbb;
    padding: 10px 20px;
}

h2 {
    margin: 12px 20px;
    font-size: 21px;
}

#catalogue {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 15px;
    padding: 15px 20px;
}

.movie {
    background: #1c1e27;
    border: 1px solid #30323c;
    border-radius: 7px;
    overflow: hidden;
    cursor: pointer;
    min-width: 0;
}

.movie img {
    width: 100%;
    height: 205px;
    object-fit: cover;
    background: #292b35;
    display: block;
}

.poster-placeholder {
    height: 205px;
    background: linear-gradient(145deg, #303340, #171820);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e50935;
    font-size: 24px;
    font-weight: bold;
}

.movie-title {
    padding: 11px;
    font-size: 14px;
    line-height: 1.4;
    min-height: 58px;
}

#details {
    display: none;
    padding: 20px;
    max-width: 850px;
}

#details h2 {
    margin: 15px 0;
    font-size: 25px;
}

#details p {
    color: #ccc;
    line-height: 1.6;
}

.detail-type {
    color: #e50935;
    text-transform: uppercase;
    font-size: 13px;
}

#backButton {
    margin-bottom: 15px;
}

#pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 20px;
}

#pageNumber {
    color: #bbb;
}

.empty {
    padding: 25px 20px;
    color: #aaa;
}

footer {
    padding: 25px;
    text-align: center;
    color: #777;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <div class="logo">CIMA4U</div>
</header>

<nav id="navigation">
    <button class="active" data-type="all">Home</button>
    <button data-type="movie">Movies</button>
    <button data-type="series">Series</button>
    <button data-type="anime">Anime</button>
</nav>

<div class="search-area">
    <input
        id="search"
        type="text"
        placeholder="Search movies, series and anime..."
        autocomplete="off"
    >
</div>

<div id="status">Loading catalogue...</div>

<main>
    <section id="listing">
        <h2 id="sectionTitle">Latest titles</h2>
        <div id="catalogue"></div>

        <div id="pagination">
            <button id="previous">Previous</button>
            <span id="pageNumber">1</span>
            <button id="next">Next</button>
        </div>
    </section>

    <section id="details">
        <button id="backButton">Back to titles</button>
        <div class="detail-type" id="detailType"></div>
        <h2 id="detailTitle"></h2>
        <p id="detailDescription"></p>
        <p id="playMessage">
            Episode playback will be connected in the next step.
        </p>
    </section>
</main>

<footer>
    Cima4U Frontend
</footer>

<script>
(function () {
    "use strict";

    var catalogue = [];
    var filtered = [];
    var currentType = "all";
    var currentPage = 1;
    var pageSize = 18;
    var selectedItem = null;

    var listing = document.getElementById("listing");
    var details = document.getElementById("details");
    var grid = document.getElementById("catalogue");
    var status = document.getElementById("status");
    var search = document.getElementById("search");

    function text(value) {
        return String(value || "");
    }

    function normalize(value) {
        return text(value).toLowerCase();
    }

    function getType(item) {
        var type = normalize(item.type);
        var category = normalize(item.category);
        var title = normalize(item.title);
        var combined = type + " " + category + " " + title;

        if (
            combined.indexOf("anime") !== -1 ||
            combined.indexOf("أنمي") !== -1 ||
            combined.indexOf("انمي") !== -1
        ) {
            return "anime";
        }

        if (
            combined.indexOf("series") !== -1 ||
            combined.indexOf("مسلسل") !== -1 ||
            combined.indexOf("الحلقة") !== -1 ||
            combined.indexOf("episode") !== -1 ||
            combined.indexOf("season") !== -1 ||
            combined.indexOf("الموسم") !== -1
        ) {
            return "series";
        }

        if (type === "movie" || type === "movies") {
            return "movie";
        }

        return type || "movie";
    }

    function setStatus(message) {
        status.innerHTML = "";
        status.appendChild(document.createTextNode(message));
    }

    function loadCatalogue() {
        var request = new XMLHttpRequest();

        request.open(
            "GET",
            "catalogue.json?v=" + new Date().getTime(),
            true
        );

        request.onreadystatechange = function () {
            if (request.readyState !== 4) {
                return;
            }

            if (request.status >= 200 && request.status < 300) {
                try {
                    var data = JSON.parse(request.responseText);

                    if (Object.prototype.toString.call(data) !== "[object Array]") {
                        throw new Error("Invalid catalogue format");
                    }

                    catalogue = data;
                    setStatus(catalogue.length + " titles loaded");
                    applyFilters();

                } catch (error) {
                    setStatus("Could not read catalogue.json.");
                }
            } else {
                setStatus("Catalogue could not be loaded. Check catalogue.json.");
            }
        };

        request.onerror = function () {
            setStatus("Network error while loading catalogue.");
        };

        request.send(null);
    }

    function applyFilters() {
        var query = normalize(search.value);
        filtered = [];

        var i;
        var item;
        var itemType;
        var searchable;

        for (i = 0; i < catalogue.length; i++) {
            item = catalogue[i];
            itemType = getType(item);

            if (currentType !== "all" && itemType !== currentType) {
                continue;
            }

            searchable = normalize(
                text(item.title) + " " +
                text(item.description) + " " +
                text(item.category)
            );

            if (query && searchable.indexOf(query) === -1) {
                continue;
            }

            filtered.push(item);
        }

        currentPage = 1;
        renderCatalogue();
    }

    function makePlaceholder() {
        var placeholder = document.createElement("div");
        placeholder.className = "poster-placeholder";
        placeholder.appendChild(document.createTextNode("CIMA4U"));
        return placeholder;
    }

    function openDetails(item) {
        selectedItem = item;

        listing.style.display = "none";
        details.style.display = "block";

        document.getElementById("detailTitle").textContent =
            text(item.title);

        document.getElementById("detailDescription").textContent =
            text(item.description) || "No description available.";

        document.getElementById("detailType").textContent =
            getType(item);

        document.getElementById("playMessage").textContent =
            "Playback servers are not connected yet. This title will not redirect you to the original website.";

        window.scrollTo(0, 0);
    }

    function closeDetails() {
        selectedItem = null;
        details.style.display = "none";
        listing.style.display = "block";
        window.scrollTo(0, 0);
    }

    function renderCatalogue() {
        grid.innerHTML = "";

        document.getElementById("sectionTitle").textContent =
            currentType === "all" ? "Latest titles" :
            currentType === "movie" ? "Movies" :
            currentType === "series" ? "Series" : "Anime";

        var start = (currentPage - 1) * pageSize;
        var end = Math.min(start + pageSize, filtered.length);
        var i;
        var item;
        var card;
        var title;
        var image;
        var poster;

        if (filtered.length === 0) {
            var empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "No titles found.";
            grid.appendChild(empty);
        }

        for (i = start; i < end; i++) {
            item = filtered[i];

            card = document.createElement("div");
            card.className = "movie";
            card.tabIndex = 0;
            card.setAttribute("role", "button");

            poster = text(item.poster || item.image);

            if (poster && /^https:\/\//i.test(poster)) {
                image = document.createElement("img");
                image.src = poster;
                image.alt = text(item.title);
                image.onerror = function () {
                    this.parentNode.replaceChild(
                        makePlaceholder(),
                        this
                    );
                };
                card.appendChild(image);
            } else {
                card.appendChild(makePlaceholder());
            }

            title = document.createElement("div");
            title.className = "movie-title";
            title.textContent = text(item.title);
            card.appendChild(title);

            (function (selected) {
                card.onclick = function () {
                    openDetails(selected);
                };

                card.onkeydown = function (event) {
                    event = event || window.event;

                    if (
                        event.keyCode === 13 ||
                        event.keyCode === 32
                    ) {
                        event.preventDefault();
                        openDetails(selected);
                    }
                };
            })(item);

            grid.appendChild(card);
        }

        document.getElementById("pageNumber").textContent =
            filtered.length === 0 ?
            "0 / 0" :
            currentPage + " / " +
            Math.ceil(filtered.length / pageSize);

        document.getElementById("previous").disabled =
            currentPage <= 1;

        document.getElementById("next").disabled =
            currentPage >= Math.ceil(filtered.length / pageSize);
    }

    function selectType(type) {
        currentType = type;

        var buttons = document.querySelectorAll("#navigation button");
        var i;

        for (i = 0; i < buttons.length; i++) {
            buttons[i].className =
                buttons[i].getAttribute("data-type") === type ?
                "active" : "";
        }

        applyFilters();
    }

    document.getElementById("navigation").onclick = function (event) {
        event = event || window.event;
        var target = event.target || event.srcElement;

        if (target && target.getAttribute("data-type")) {
            selectType(target.getAttribute("data-type"));
        }
    };

    search.onkeyup = function () {
        applyFilters();
    };

    document.getElementById("backButton").onclick = closeDetails;

    document.getElementById("previous").onclick = function () {
        if (currentPage > 1) {
            currentPage--;
            renderCatalogue();
        }
    };

    document.getElementById("next").onclick = function () {
        if (currentPage < Math.ceil(filtered.length / pageSize)) {
            currentPage++;
            renderCatalogue();
        }
    };

    document.onkeydown = function (event) {
        event = event || window.event;

        var key = event.keyCode;

        if (key === 27 || key === 8) {
            if (details.style.display === "block") {
                event.preventDefault();
                closeDetails();
            }
        }
    };

    loadCatalogue();

})();
</script>

</body>
</html>
