<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Cima4U Player</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #08090d; color: #fff; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; }
#topbar { display: flex; align-items: center; min-height: 60px; padding: 7px 14px; background: #15151e; border-bottom: 2px solid #343440; }
#back { flex: none; padding: 11px 20px; background: #292936; color: #fff; border: 2px solid #555566; border-radius: 6px; font-size: 18px; font-weight: bold; }
#back:focus { outline: 3px solid #e6b75b; }
#title { min-width: 0; flex: 1; padding-left: 18px; color: #e5e0eb; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#servers { display: flex; flex-wrap: nowrap; align-items: center; min-height: 61px; padding: 9px 12px; background: #101018; overflow-x: auto; overflow-y: hidden; }
.server-button { flex: none; min-width: 125px; margin: 0 9px 0 0; padding: 11px 15px; background: #282834; color: #fff; border: 2px solid #444454; border-radius: 6px; font-size: 16px; font-weight: bold; text-align: center; }
.server-button:focus { outline: 3px solid #e6b75b; outline-offset: 1px; }
.server-button.active { background: #713ee8; border-color: #a184ff; }
#player { position: relative; flex: 1; min-height: 0; width: 100%; background: #000; }
#videoFrame { display: block; width: 100%; height: 100%; border: 0; background: #000; }
#message { position: absolute; z-index: 2; top: 50%; left: 50%; width: 90%; max-width: 700px; transform: translate(-50%, -50%); color: #ccc; text-align: center; font-size: 20px; line-height: 1.5; pointer-events: none; }
@media (max-width: 700px) {
  #topbar { min-height: 50px; padding: 5px 8px; }
  #back { padding: 8px 12px; font-size: 15px; }
  #title { padding-left: 10px; font-size: 14px; }
  #servers { min-height: 50px; padding: 7px; }
  .server-button { min-width: 100px; margin-right: 7px; padding: 9px; font-size: 14px; }
}
</style>
</head>
<body>
<div id="topbar">
  <button id="back" type="button">BACK</button>
  <div id="title">CIMA4U PLAYER</div>
</div>
<div id="servers" aria-label="Video servers"></div>
<div id="player">
  <div id="message">Choose a server to start playback.</div>
  <iframe id="videoFrame" title="Video player" allowfullscreen allow="autoplay; fullscreen; picture-in-picture"></iframe>
</div>
<script src="player.js"></script>
</body>
</html>
