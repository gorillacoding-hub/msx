<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSX Player</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #08090d;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
}

#topbar {
  height: 65px;
  min-height: 65px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  background: #15151e;
  border-bottom: 2px solid #343440;
}

#back {
  color: white;
  background: #292936;
  border: 2px solid #555566;
  border-radius: 8px;
  padding: 12px 25px;
  font-size: 20px;
  font-weight: bold;
}

#back:focus {
  outline: 3px solid #e6b75b;
}

#title {
  flex: 1;
  padding-left: 25px;
  font-size: 18px;
  color: #ddd;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#servers {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  background: #101018;
  overflow-x: auto;
  min-height: 65px;
}

.server {
  flex: none;
  min-width: 130px;
  padding: 12px 18px;
  background: #282834;
  color: white;
  border: 2px solid #444454;
  border-radius: 8px;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.server:focus {
  outline: 3px solid #e6b75b;
}

.server.active {
  background: #713ee8;
  border-color: #a184ff;
}

#player {
  flex: 1;
  min-height: 0;
  width: 100%;
  background: #000;
  position: relative;
}

#videoFrame {
  width: 100%;
  height: 100%;
  border: 0;
  background: #000;
}

#message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #aaa;
  text-align: center;
  font-size: 20px;
  display: none;
}

@media (max-width: 700px) {
  #topbar {
    height: 50px;
    min-height: 50px;
    padding: 0 8px;
  }

  #back {
    padding: 8px 12px;
    font-size: 16px;
  }

  #title {
    font-size: 14px;
    padding-left: 10px;
  }

  #servers {
    min-height: 50px;
    padding: 8px;
    gap: 8px;
  }

  .server {
    min-width: 100px;
    padding: 9px;
    font-size: 14px;
  }
}
</style>
</head>

<body>

<div id="topbar">
  <button id="back">BACK</button>
  <div id="title">MEDIA STATION X</div>
</div>

<div id="servers"></div>

<div id="player">
  <div id="message">Select a server</div>
  <iframe
    id="videoFrame"
    allowfullscreen
    allow="autoplay; fullscreen; picture-in-picture"
    referrerpolicy="no-referrer"
  ></iframe>
</div>

<script src="player.js"></script>

</body>
</html>
