<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cima4U Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080d18;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 55px;
    background: #111827;
    display: flex;
    align-items: center;
    padding: 0 15px;
}

button {
    background: #192941;
    color: white;
    border: 2px solid #45536a;
    border-radius: 5px;
    padding: 10px 18px;
    font-size: 16px;
}

button:focus {
    background: #e50935;
    color: white;
    outline: 3px solid white;
}

#player {
    width: 100%;
    height: calc(100vh - 55px);
    border: 0;
    background: black;
}

#message {
    padding: 20px;
    color: #ccc;
}
</style>
</head>

<body>

<header>
    <button onclick="goBack()">BACK</button>
</header>

<div id="message">Loading original Cima4U player...</div>

<iframe
    id="player"
    allowfullscreen
    allow="autoplay; fullscreen"
    frameborder="0"
    referrerpolicy="no-referrer">
</iframe>

<script src="player.js"></script>

</body>
</html>
