name: Update Cima4U Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check Python
        run: python --version

      - name: Generate catalogue
        run: python cima4u/update_catalogue.py

      - name: Validate catalogue
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          path = "cima4u/catalogue.json"

          if not os.path.isfile(path):
              sys.exit("ERROR: catalogue.json was not created")

          if os.path.getsize(path) == 0:
              sys.exit("ERROR: catalogue.json is empty")

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as e:
              sys.exit("ERROR: Invalid JSON: " + str(e))

          if not isinstance(data, list):
              sys.exit("ERROR: Catalogue must be a JSON list")

          if len(data) == 0:
              sys.exit("ERROR: Catalogue contains zero titles")

          print("VALID catalogue:", len(data), "titles")
          PY

      - name: Commit and push catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cima4u/catalogue.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Cima4U catalogue"
          fi

          git push origin main

      - name: Verify catalogue after update
        run: |
          python - <<'PY'
          import json

          with open("cima4u/catalogue.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, list) or not data:
              raise SystemExit("ERROR: Published catalogue is invalid or empty")

          print("SUCCESS: Catalogue contains", len(data), "titles")
          PY
