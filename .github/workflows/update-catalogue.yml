name: Update Cima4U Catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-catalogue:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate catalogue
        run: python cima4u/update_catalogue.py

      - name: Save updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cima4u/catalogue.json
          git diff --cached --quiet || git commit -m "Update Cima4U catalogue"
          git push
